<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Subtil Controls for YouTube</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-48.png" width="36" height="36" alt="">
    <div>
      <h1>Subtil Controls for YouTube</h1>
      <span class="version" id="version"></span>
    </div>
  </header>

  <!-- Decorative map of the playback bar; the list below carries the same information as text. -->
  <div class="bar" aria-hidden="true">
    <span class="control is-ours">
      <span class="callout callout-above" data-i18n="loop">Loop current video</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12v-1a4.5 4.5 0 0 1 4.5-4.5H20m-3.5-3.5L20 6.5 16.5 10"/>
        <path d="M21 12v1a4.5 4.5 0 0 1-4.5 4.5H4m3.5 3.5L4 17.5 7.5 14"/>
      </svg>
    </span>
    <span class="control is-ours">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 12C4.9 7.9 8.1 5.8 12 5.8s7.1 2.1 9.5 6.2c-2.4 4.1-5.6 6.2-9.5 6.2S4.9 16.1 2.5 12Z"/>
        <path fill="currentColor" stroke="none" fill-rule="evenodd" d="M7.6 11a4.4 4.4 0 1 0 8.8 0a4.4 4.4 0 1 0-8.8 0ZM12.3 9.9a1.35 1.35 0 1 0 2.7 0a1.35 1.35 0 1 0-2.7 0Z"/>
        <path class="slash-backdrop" d="M4.5 4.5l15 15"/>
        <path class="slash" d="M4.5 4.5l15 15"/>
      </svg>
      <span class="callout callout-below" data-i18n="audioOnly">Audio only</span>
    </span>
    <span class="control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="18" height="12" rx="2.5"/>
        <path d="M7.5 12H11m2.5 0h3.5"/>
      </svg>
    </span>
    <span class="control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="6.5" stroke-width="3.2" stroke-dasharray="2.55 2.55"/>
        <circle cx="12" cy="12" r="4.6" stroke-width="2"/>
      </svg>
    </span>
    <span class="control">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V5h4m8 0h4v4m0 6v4h-4m-8 0H4v-4"/>
      </svg>
    </span>
  </div>

  <p class="where" data-i18n="popupWhere">Open a YouTube video. Both buttons are in the playback bar.</p>

  <dl>
    <dt data-i18n="loop">Loop current video</dt>
    <dd data-i18n="popupLoopHelp">Replays the video until you turn it off.</dd>
    <dt data-i18n="audioOnly">Audio only</dt>
    <dd data-i18n="popupAudioHelp">Turns off the video stream and keeps the sound playing.</dd>
  </dl>

  <footer>
    <a class="primary" href="https://www.youtube.com/" target="_blank" rel="noopener" data-i18n="popupOpenYouTube">Open YouTube</a>
    <a href="https://chromewebstore.google.com/detail/subtil-controls-for-youtu/kdoeimddkggcblkofpbgkmloimpmkddf/support" target="_blank" rel="noopener" data-i18n="popupReport">Report a problem</a>
  </footer>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
